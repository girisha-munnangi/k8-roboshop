apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: backend
spec:
  replicas: 1
  selectors:
    matchLabels:
      project: roboshop
      component: cart
      tier: backend
  template:
    metadata:
      name: cart
      namespace: roboshop
      labels:
        project: roboshop
        component: cart
        tier: backend
    spec:
      containers:
      - name: cart
        image: girishamunnangi/
        ImagePullPolicy: Always
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "120m"
          memory: "150Mi"
      readinessProbe:
        tcpSocket:
          port: 8080
        failureThreshold: 2
        periodSeconds: 10
        initialDelaySeconds: 15
      livenessProbe:
        httpGet:
          port: 8080
          path: /health
        failureThreshold: 2
        periodSeconds: 10
      envFrom:
      - configMapRef:
          name: cart
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
spec:
  selector:
    labels:
      project: roboshop
      component: cart
      tier: backend 
ports:
- protocol: TCP
  port: 8080
  targetPort: 8080

        
        

