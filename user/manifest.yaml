apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
data:
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"
  MONGO: "true"
---
apiVersion: v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: backend
  template:
    metadata:
      name: user
      namespace: roboshop
      labels:
        project: roboshop
        component: mysql
        tier: backend
    spec:
      containers:
      - name: user
        image: girishamunnangi/
        imagePullPolicy: Always
      resources:
        requests:
          cpu: "100m"
          memory: "128M"
        limits:
          cpu: "100m"
          memory: "128M"
        readinessProbe:
          tcpSocket:
            port: 8080
            failureThreshold: 2
            initialDelaySeconds: 15
            periodSeconds: 10
        livenssProbe:
          httpGet:
            path: /health
            port: 8080
            failureThreshold: 2
            periodSeconds: 10
        envFrom:
        - configMapRef:
            name: user
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
spec:
  selector:
    labels:
      project: roboshop
      component: mysql
      tier: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
